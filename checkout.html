<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформлення замовлення · Літо в банці</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=e6f8215a">
</head>
<body>

<header class="top" id="top" data-home="./"></header>

<main>
  <section>
    <div class="wrap" style="max-width:640px">
      <h2>Ваше замовлення</h2>
      <div id="view"></div>
    </div>
  </section>
</main>

<footer id="foot"></footer>

<script src="products.js?v=e6f8215a"></script>
<script src="common.js?v=e6f8215a"></script>
<script>
  const view = document.getElementById("view");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function cartPanel() {
    const lines = Cart.lines();
    if (!lines.length) return `<div class="panel empty">Кошик порожній.<br><br><a class="btn" href="./#menu">Обрати смаки</a></div>`;
    return `<div class="panel"><h3>Кошик</h3>
      ${lines.map(l => `<div class="line">
        <div><b>${esc(l.title)}</b><small>${esc(l.detail)}</small>
          <button class="rm" data-kind="${l.kind}" data-key="${l.key ?? l.index}">Прибрати</button></div>
        <div>${money(l.sum)}</div></div>`).join("")}
      <div class="total"><span>Разом</span><b>${money(Cart.total())}</b></div>
      <p style="margin:8px 0 0;font-size:14px;color:var(--muted)">Доставка — за тарифами пошти.</p>
    </div>`;
  }

  const field = (id, label, opts = "") => `
    <div class="field" id="f-${id}"><label for="${id}">${label}</label>
      <input id="${id}" name="${id}" ${opts}><div class="err">Заповніть це поле</div></div>`;

  // City and branch fields with a dropdown list (filled from the Nova Poshta API).
  const acField = id => `
    <div class="field ac-field" id="f-${id}"><label for="${id}"></label>
      <input id="${id}" name="${id}" autocomplete="off" required>
      <ul class="ac" hidden></ul><div class="err"></div></div>`;

  // ---- Nova Poshta ----
  const NP = { mode: "np", down: false, cityRef: null, whPicked: false };
  async function npCall(method, props) {
    const res = await fetch("https://api.novaposhta.ua/v2.0/json/", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey: SHOP.npApiKey, modelName: "AddressGeneral", calledMethod: method, methodProperties: props }) });
    const d = await res.json();
    if (!d.success) throw new Error((d.errors || []).join("; ") || "NP error");
    return d.data;
  }
  const npOn = () => NP.mode === "np" && !NP.down;

  async function findCities(q) {
    if (q.length < 2) return null;
    const d = await npCall("searchSettlements", { CityName: q, Limit: "20", Page: "1" });
    return (d[0]?.Addresses || []).filter(a => a.Warehouses > 0)
      .map(a => ({ label: a.Present, ref: a.DeliveryCity }));
  }
  async function findBranches(q) {
    if (!NP.cityRef) return null;
    const d = await npCall("getWarehouses", { CityRef: NP.cityRef, FindByString: q, Limit: "50", Page: "1" });
    const list = d.map(w => ({ label: w.Description, num: w.Number }));
    if (/^\d+$/.test(q)) list.sort((a, b) => (b.num === q) - (a.num === q)); // exact number first
    return list;
  }

  // Generic dropdown for one input. fetcher(q) -> [{label,...}] or null (hide the list).
  function autocomplete(input, fetcher, onPick) {
    const list = input.parentElement.querySelector(".ac");
    let timer, seq = 0, items = [];
    const run = () => {
      if (!npOn()) return;
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const my = ++seq;
        try {
          const arr = await fetcher(input.value.trim());
          if (my !== seq || document.activeElement !== input) return;
          if (!arr) { list.hidden = true; return; }
          items = arr;
          list.innerHTML = arr.length ? arr.map((x, i) => `<li data-i="${i}">${esc(x.label)}</li>`).join("")
            : `<li class="none">Нічого не знайдено</li>`;
          list.hidden = false;
        } catch (err) { npFail(err); }
      }, 300);
    };
    input.addEventListener("input", () => { if (npOn()) onPick(null); run(); });
    input.addEventListener("focus", run);
    input.addEventListener("blur", () => setTimeout(() => { list.hidden = true; }, 150));
    list.addEventListener("pointerdown", e => {
      const li = e.target.closest("li[data-i]");
      if (!li) return;
      e.preventDefault();
      const x = items[+li.dataset.i];
      input.value = x.label;
      list.hidden = true;
      onPick(x);
      input.closest(".field").classList.remove("bad");
    });
  }

  // Labels and hints for the chosen post service.
  function setPostMode(mode) {
    NP.mode = mode;
    const city = document.getElementById("city"), br = document.getElementById("np");
    const fc = document.getElementById("f-city"), fb = document.getElementById("f-np");
    const on = npOn();
    fc.querySelector("label").textContent = "Місто";
    fb.querySelector("label").textContent = mode === "np" ? "Відділення або поштомат" : "Пошта і відділення";
    city.placeholder = on ? "Почніть вводити назву" : "";
    br.placeholder = on ? (NP.cityRef ? "Номер або адреса" : "Спочатку оберіть місто")
      : mode === "np" ? "№ відділення або поштомату" : "Служба і № відділення (Укрпошта, Meest…)";
    br.disabled = on && !NP.cityRef;
    fc.querySelector(".err").textContent = on ? "Оберіть місто зі списку" : "Заповніть це поле";
    fb.querySelector(".err").textContent = on ? "Оберіть відділення зі списку" : "Заповніть це поле";
    fc.classList.remove("bad"); fb.classList.remove("bad");
  }

  function npFail(err) {
    console.warn("Nova Poshta API:", err);
    if (NP.down) return;
    NP.down = true;
    document.querySelectorAll(".ac").forEach(l => { l.hidden = true; });
    const note = document.createElement("div");
    note.className = "notice";
    note.textContent = "Не вдалося завантажити список Нової пошти. Впишіть місто і відділення вручну.";
    document.getElementById("f-city").before(note);
    setPostMode(NP.mode);
  }

  function initPost() {
    const city = document.getElementById("city"), br = document.getElementById("np");
    if (!city) return;
    NP.cityRef = null; NP.whPicked = false;
    autocomplete(city, findCities, x => {
      if ((x?.ref || null) === NP.cityRef && x) return;
      NP.cityRef = x?.ref || null;
      NP.whPicked = false; br.value = "";
      setPostMode(NP.mode);
    });
    autocomplete(br, findBranches, x => { NP.whPicked = !!x; });
    document.querySelectorAll("input[name=post]").forEach(r => {
      r.checked = r.value === NP.mode;
      r.addEventListener("change", () => {
        NP.cityRef = null; NP.whPicked = false;
        if (NP.mode === "np" || r.value === "np") { br.value = ""; }
        setPostMode(r.value);
      });
    });
    setPostMode(NP.mode);
  }

  function render() {
    const has = Cart.lines().length;
    view.innerHTML = cartPanel() + (has ? `
      <form class="panel" id="form" novalidate>
        <h3>Ваші контакти</h3>
        ${SHOP.orderEndpoint ? "" : `<div class="notice">Тестовий режим: замовлення ще не надсилається. Підключимо Telegram-бота.</div>`}
        ${field("name", "Ім'я та прізвище", 'autocomplete="name" required')}
        ${field("phone", "Телефон", 'type="tel" autocomplete="tel" placeholder="+380" required')}
        ${field("tg", "Telegram <small>(необов'язково)</small>", 'placeholder="@нік"')}
        <div class="field"><label>Доставка</label>
          <div class="radio">
            <label><input type="radio" name="post" value="np" checked>Нова пошта</label>
            <label><input type="radio" name="post" value="other">Інша пошта</label>
          </div></div>
        ${acField("city")}
        ${acField("np")}
        <div class="field"><label>Оплата</label>
          <div class="radio">
            <label><input type="radio" name="pay" value="Переказ на карту" checked>На карту</label>
            <label><input type="radio" name="pay" value="Накладений платіж">Накладений платіж</label>
          </div></div>
        <div class="field"><label for="note">Коментар <small>(необов'язково)</small></label>
          <textarea id="note" name="note" rows="3"></textarea></div>
        <div class="send-error" id="sendError" role="alert" hidden>
          <b>Не вдалося надіслати замовлення 😔</b>
          Ваш кошик і дані збережені. Спробуйте ще раз за хвилину або напишіть нам в Instagram — ми все оформимо вручну.
          <a class="btn ghost" href="https://ig.me/m/${SHOP.instagram}" target="_blank" rel="noopener">Написати в Instagram</a>
        </div>
        <button class="btn" style="width:100%" type="submit">Підтвердити замовлення</button>
        <p style="font-size:13px;color:var(--muted);text-align:center;margin:10px 0 0">Ми зв'яжемося з вами, щоб підтвердити замовлення.</p>
      </form>` : "");
    initPost();
  }

  view.addEventListener("click", e => {
    const b = e.target.closest(".rm");
    if (!b) return;
    if (b.dataset.kind === "set") Cart.removeSet(+b.dataset.key);
    else { const [id, size] = b.dataset.key.split("|"); Cart.add(id, size, -Cart.qty(id, size)); }
  });
  document.addEventListener("cart", render);

  view.addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, data = Object.fromEntries(new FormData(f));
    let ok = true;
    for (const k of ["name", "phone", "city", "np"]) {
      let bad = !(data[k] || "").trim();
      if (k === "phone") bad = data.phone.replace(/\D/g, "").length < 10;
      if (k === "city" && npOn()) bad = !NP.cityRef;
      if (k === "np" && npOn()) bad = !NP.whPicked;
      document.getElementById("f-" + k).classList.toggle("bad", bad);
      if (bad) ok = false;
    }
    if (!ok) { f.querySelector(".bad input:not(:disabled)")?.focus(); return; }

    delete data.post;
    const order = {
      ...data,
      np: (NP.mode === "np" ? "Нова пошта, " : "") + data.np.trim(),
      items: Cart.lines().map(l => `${l.title} (${l.detail}) — ${money(l.sum)}`),
      total: money(Cart.total()),
      time: new Date().toLocaleString("uk-UA"),
    };
    const btn = f.querySelector("button[type=submit]");
    const errBox = document.getElementById("sendError");
    errBox.hidden = true;
    btn.disabled = true; btn.textContent = "Надсилаємо…";
    try {
      if (SHOP.orderEndpoint) {
        // text/plain avoids a CORS preflight; Apps Script reads the JSON body and answers "ok" or "error".
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 25000);
        const res = await fetch(SHOP.orderEndpoint, { method: "POST", signal: ctrl.signal,
          headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(order) });
        clearTimeout(timer);
        const answer = (await res.text()).trim();
        if (!res.ok || answer !== "ok") throw new Error("server: " + answer.slice(0, 80));
      } else {
        console.log("TEST ORDER", order);
      }
      document.removeEventListener("cart", render);
      Cart.clear();
      view.innerHTML = `<div class="panel" style="text-align:center">
        <h3>Дякуємо, ${esc(data.name.split(" ")[0])}! ❤️</h3>
        <p>Замовлення прийнято. Ми скоро зв'яжемося з вами за номером ${esc(data.phone)}.</p>
        <a class="btn" href="./">На головну</a></div>`;
    } catch (err) {
      console.warn("Order not sent:", err);
      btn.disabled = false; btn.textContent = "Спробувати ще раз";
      errBox.hidden = false;
      errBox.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  });

  render();
</script>
</body>
</html>
